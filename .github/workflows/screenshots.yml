name: Screenshots

on:
  push:
    branches:
      - feature/*
      - main
  pull_request:
    branches:
      - main
      - develop

env:
  DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer

jobs:
  screenshots:
    name: Generate Screenshots
    runs-on: macos-latest
    
    strategy:
      matrix:
        scheme: [CryptoPortfolio]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        
    - name: Install dependencies
      run: |
        gem install fastlane
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.0'
        
    - name: List available simulators
      run: xcrun simctl list devices
      
    - name: Build app for testing
      run: fastlane ios build_for_testing
      
    - name: Run Light Mode Screenshots
      run: fastlane ios screenshots_light
      continue-on-error: true
      
    - name: Run Dark Mode Screenshots
      run: fastlane ios screenshots_dark
      continue-on-error: true
      
    - name: Upload Light Mode Screenshots
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-light
        path: fastlane/screenshots/light/
        retention-days: 30
        
    - name: Upload Dark Mode Screenshots
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-dark
        path: fastlane/screenshots/dark/
        retention-days: 30
        
    - name: Comment PR with Screenshots
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId
          });
          
          const lightScreenshots = artifacts.find(a => a.name === 'screenshots-light');
          const darkScreenshots = artifacts.find(a => a.name === 'screenshots-dark');
          
          let body = '## 📸 Screenshots Generated\n\n';
          body += 'Screenshots have been generated for this PR.\n\n';
          body += '### Downloads\n';
          if (lightScreenshots) {
            body += `- [Light Mode Screenshots](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${lightScreenshots.id})\n`;
          }
          if (darkScreenshots) {
            body += `- [Dark Mode Screenshots](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${darkScreenshots.id})\n`;
          }
          body += '\n> Note: Download the artifacts to view the full screenshots.\n';
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

  ui-tests:
    name: Run UI Tests
    runs-on: macos-latest
    needs: screenshots
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        
    - name: Install dependencies
      run: |
        gem install fastlane
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.0'
        
    - name: Run UI Tests
      run: fastlane ios ui_tests
      continue-on-error: true