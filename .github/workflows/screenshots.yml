name: Screenshots

on:
  push:
    branches:
      - feature/*
      - main
  pull_request:
    branches:
      - main
      - develop

jobs:
  screenshots:
    name: Generate Screenshots (${{ matrix.scheme }})
    runs-on: macos-latest

    strategy:
      matrix:
        scheme: [CryptoPortfolio]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Cache iOS Simulator Runtime
      id: ios-runtime-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/CoreSimulator/Volumes/
          /Library/Developer/CoreSimulator/Volumes/
        key: ios-runtime-18.2-xcode-16.2-${{ runner.os }}

    - name: Install iOS 18.2 Simulator Runtime
      if: steps.ios-runtime-cache.outputs.cache-hit != 'true'
      run: |
        echo "iOS runtime not cached — downloading iOS 18.2 simulator..."
        sudo xcodebuild -downloadPlatform iOS
        echo "✅ iOS platform download complete"

    - name: Boot iPhone 15 Pro Simulator
      run: |
        UDID=$(xcrun simctl create "iPhone 15 Pro" "iPhone 15 Pro" "iOS18.2" 2>/dev/null || \
               xcrun simctl list devices | grep "iPhone 15 Pro" | grep -E "\(([A-F0-9-]+)\)" -o | tr -d "()" | head -1)
        echo "Simulator UDID: $UDID"
        xcrun simctl boot "$UDID" 2>/dev/null || true

    - name: List available simulators
      run: xcrun simctl list devices available | grep -E "iPhone 1[5-6]"

    - name: Build app for testing
      run: bundle exec fastlane ios build_for_testing

    - name: Run Light Mode Screenshots
      run: bundle exec fastlane ios screenshots_light
      continue-on-error: true

    - name: Run Dark Mode Screenshots
      run: bundle exec fastlane ios screenshots_dark
      continue-on-error: true

    - name: Upload Light Mode Screenshots
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-light
        path: fastlane/screenshots/light/
        retention-days: 30

    - name: Upload Dark Mode Screenshots
      uses: actions/upload-artifact@v4
      with:
        name: screenshots-dark
        path: fastlane/screenshots/dark/
        retention-days: 30

    - name: Comment PR with Screenshots
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
            owner: context.repo.owner,
            repo: context.repo.repo,
            run_id: context.runId
          });

          const lightScreenshots = artifacts.find(a => a.name === 'screenshots-light');
          const darkScreenshots = artifacts.find(a => a.name === 'screenshots-dark');

          let body = '## 📸 Screenshots Generated\n\n';
          body += 'Screenshots have been generated for this PR.\n\n';
          body += '### Downloads\n';
          if (lightScreenshots) {
            body += `- [Light Mode Screenshots](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${lightScreenshots.id})\n`;
          }
          if (darkScreenshots) {
            body += `- [Dark Mode Screenshots](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${darkScreenshots.id})\n`;
          }
          body += '\n> Note: Download the artifacts to view the full screenshots.\n';

          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: body
          });

  ui-tests:
    name: Run UI Tests
    runs-on: macos-latest
    needs: screenshots

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'

    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true

    - name: Cache iOS Simulator Runtime
      id: ios-runtime-cache
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Developer/CoreSimulator/Volumes/
          /Library/Developer/CoreSimulator/Volumes/
        key: ios-runtime-18.2-xcode-16.2-${{ runner.os }}

    - name: Install iOS 18.2 Simulator Runtime
      if: steps.ios-runtime-cache.outputs.cache-hit != 'true'
      run: sudo xcodebuild -downloadPlatform iOS

    - name: Run UI Tests
      run: bundle exec fastlane ios ui_tests
      continue-on-error: true
